# SpeakLab — the whole service graph, declared once.
#
# Nine services. Six start by default — postgres, api, frontend, asr, tts, and
# volume-owner, a job that runs before the others and exits — and three are behind
# profiles, because a profiled service is excluded from `up` AND from `build`:
#
#   pron     pron                     torch, ~2 GB. Profiled for that reason alone
#   llm      ollama                   NOT the default. See the api service's comment
#   tools    test                     batch jobs with an exit code, not services
#
# Every published port is bound to 127.0.0.1. The stack is for the person at this
# machine: the database has a development password, and the model services answer anyone
# who can reach them. The health checks are in the images, not here.

services:

  # ── Storage ────────────────────────────────────────────────────────────────
  postgres:
    # Stock image, pulled not built. No PostGIS: nothing here is spatial. No pgvector:
    # nothing here is a retrieval problem. An unused extension is a lie about the
    # system, and a Dockerfile whose only line is `FROM postgres:16` is the same lie in
    # a different file.
    #
    # There is also no docker-entrypoint-initdb.d script. Alembic owns the schema, and an
    # init.sql that also created tables would be a second source of truth that runs
    # exactly once, on an empty volume, and silently diverges after that.
    # Pinned to a minor release, so a security release arrives as a reviewed change to
    # this line rather than whenever the tag moves.
    image: postgres:16.15
    environment:
      POSTGRES_DB: ${DB_NAME:-speaklab}
      POSTGRES_USER: ${DB_USER:-speaklab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-speaklab_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-speaklab} -d ${DB_NAME:-speaklab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - speaklab

  # Hands the named volumes to the account the services run as, then exits. A volume first
  # written by an image that ran as root holds files that account cannot replace, and a
  # recording or a model download would fail on them. It changes only what it finds owned
  # by someone else, so on a volume that is already right it does nothing. `-h` changes a
  # symlink itself rather than what it points to; the model cache is full of them.
  volume-owner:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      target: runtime
    user: root
    entrypoint: ["find", "/audio", "/models", "!", "-user", "10001", "-exec", "chown", "-h", "10001:10001", "{}", "+"]
    volumes:
      - audio_data:/audio
      - model_cache:/models
    healthcheck:
      disable: true
    network_mode: none

  # ── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      # Context is the repository root so the image can COPY api/ and run without a
      # bind mount. .dockerignore keeps that context small — without it the build
      # would ship spike/.venv and frontend/node_modules to the daemon.
      context: .
      dockerfile: infra/api/Dockerfile
      target: runtime
    # depends_on lists postgres and the volume job and NOTHING ELSE, deliberately. The API
    # must start and serve scenarios, sessions, auth and progress while asr/tts/pron are
    # still loading their weights, and on a machine that never starts them at all. Adding
    # a model service here would turn a degraded stack into a dead one.
    depends_on:
      postgres:
        condition: service_healthy
      volume-owner:
        condition: service_completed_successfully
    # Every key in .env reaches the API, not only the ones `environment:` below names.
    # Without this, the tuning keys in .env.example — the LLM estimator, the progress
    # gates, paging — were documented, editable, and read by nothing: config.py only sees
    # what the container is given. `environment:` still wins where both set a key, so
    # the explicit entries below behave exactly as before, and config.py stays the one
    # place a default lives. Optional, because CI and a fresh clone have no .env.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-speaklab}:${DB_PASSWORD:-speaklab_dev}@postgres:5432/${DB_NAME:-speaklab}
      SQL_ECHO: ${SQL_ECHO:-0}
      ASR_URL: ${ASR_URL:-http://asr:8101}
      TTS_URL: ${TTS_URL:-http://tts:8102}
      PRON_URL: ${PRON_URL:-http://pron:8103}
      HEALTH_PROBE_TIMEOUT_S: ${HEALTH_PROBE_TIMEOUT_S:-1.5}
      # Audio. AUDIO_ROOT is the mount point of the audio_data volume below, and
      # the API refuses to serve any path that does not resolve inside it.
      AUDIO_ROOT: ${AUDIO_ROOT:-/audio}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Speech synthesis. PIPER_VOICE is read by the API as well as by the tts
      # container, because each turn records which voice produced its audio.
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      TTS_TIMEOUT_S: ${TTS_TIMEOUT_S:-30}
      # Generous, and deliberately so: a cold asr container is loading weights, and the
      # first transcription after a restart pays for it. The health probe is the short
      # timeout; this is the working one.
      ASR_TIMEOUT_S: ${ASR_TIMEOUT_S:-120}
      # Points at the HOST's Ollama, not the container below. Docker Desktop on macOS
      # cannot pass the Apple GPU into a Linux container, so the containerised Ollama
      # runs CPU-only while the host's uses Metal — the same model, several times
      # slower, for no benefit. Set OLLAMA_BASE_URL=http://ollama:11434 to use the
      # container instead (Linux with a GPU, or CI).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-120}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-4000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-400}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3003}
      # Auth. JWT_SECRET has no default here on purpose: unset, it arrives as an
      # empty string, config.py treats blank as absent and falls back to the built-in
      # development key, and the API says so in its startup log on every boot.
      JWT_SECRET: ${JWT_SECRET:-}
      ACCESS_TOKEN_TTL_HOURS: ${ACCESS_TOKEN_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    # Docker Desktop resolves host.docker.internal on its own; Linux does not, and this
    # line is what makes the host-Ollama default portable rather than a Mac-only trick.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # --reload, because ./api is bind-mounted over the image's copy below. The image runs
    # without it.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./api:/app
      # Named volume for audio, not a bind mount. Recordings must survive a rebuild and
      # must never be able to appear in `git status`.
      - audio_data:/audio
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - speaklab

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Two URLs because there are two callers. The browser resolves localhost:8002 from
      # the host; a server component resolves api:8000 inside the compose network. Using
      # one for both is the classic Next.js container bug.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:8000}
    volumes:
      - ./frontend:/app
      # Anonymous volumes so the container's own node_modules and .next survive the
      # bind mount above rather than being shadowed by the host's (empty, or built for
      # macOS) copies.
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - speaklab

  # ── Model services ─────────────────────────────────────────────────────────
  #
  # asr and tts are in the default stack; pron has a profile of its own. All three are
  # the same shape: a small
  # FastAPI app wrapping one model, and a /health that answers 200 with a `*_loaded:
  # false` flag before the weights finish loading — a cold start is minutes and must not
  # read as a crash — reserving 503 for the one case that is not a cold start, a load
  # that has actually failed.
  #
  # They differ in where the weights live, and the difference is size. Whisper's weights
  # are 464 MB and wav2vec2's 1.2 GB, so both are downloaded once into the shared
  # model_cache volume. A Piper voice is 63 MB, small enough to bake into the image at build time,
  # which removes the cold first turn entirely. tts still mounts the volume, because a
  # voice other than the default is cached there.

  asr:
    build: ./infra/asr
    # No profile: part of the default stack. `docker compose up -d` therefore builds
    # this image and downloads the weights on a first run — minutes, once. Nothing
    # depends_on it, so the rest of the stack comes up while that happens.
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      # The decoder settings that move the numbers in docs/decisions/0001. Overridable
      # so the measurement in that document can be reproduced without editing a file.
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-5}
      WHISPER_VAD: ${WHISPER_VAD:-1}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
      HF_HOME: /models
    depends_on:
      volume-owner:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:8101:8101"
    networks:
      - speaklab

  tts:
    build:
      context: ./infra/tts
      args:
        # The voice baked into the image. It has to be a build argument as well as a
        # runtime variable, because the two answer different questions: this one decides
        # what the image ships with, PIPER_VOICE below decides what the process loads.
        # Setting only the runtime one still works — the voice is downloaded into the
        # shared volume on first start — it just costs a minute the first time.
        PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
    # No profile: part of the default stack. Nothing depends_on it, so the rest of the
    # stack comes up regardless.
    environment:
      PIPER_VOICE: ${PIPER_VOICE:-en_US-lessac-medium}
      # 8, and it is measured rather than chosen. onnxruntime's own default is 2.3x
      # slower here — 831 ms against 368 ms on an 80-token reply — which is the
      # difference between missing the 400 ms synthesis budget and meeting it. The curve is
      # a U with its minimum at 8 on this 16-core machine; 0 restores the library
      # default. docs/decisions/0002 has the sweep.
      PIPER_NUM_THREADS: ${PIPER_NUM_THREADS:-8}
      # Below 1 is faster speech, above 1 is slower. 1.0 is the voice's trained rate.
      PIPER_LENGTH_SCALE: ${PIPER_LENGTH_SCALE:-1.0}
      PIPER_VOICE_DIR: /models/piper
    depends_on:
      volume-owner:
        condition: service_completed_successfully
    volumes:
      # For voices other than the one in the image. Shared with asr and pron so a
      # rebuild never re-downloads anything.
      - model_cache:/models
    ports:
      - "127.0.0.1:8102:8102"
    networks:
      - speaklab

  pron:
    build: ./infra/pron
    # Its own profile. This is the only image with torch in it (1.87 GB), and the stack
    # has to be usable by someone who never wants to download that.
    profiles: ["pron"]
    environment:
      PRON_MODEL: ${PRON_MODEL:-facebook/wav2vec2-lv-60-espeak-cv-ft}
      HF_HOME: /models
    depends_on:
      volume-owner:
        condition: service_completed_successfully
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:8103:8103"
    networks:
      - speaklab

  # ── Generation ─────────────────────────────────────────────────────────────
  ollama:
    # Opt-in and NOT the default target on this machine — see the api service above for
    # why. This definition exists for a Linux host with a GPU, and for CI, where a
    # self-contained stack matters more than throughput.
    #
    # Pinned to an exact release, so the container serves the model the same way every
    # time. Gemma 3 needs 0.6.0 or later.
    image: ollama/ollama:0.34.0
    profiles: ["llm"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - speaklab

  # ── Tools ──────────────────────────────────────────────────────────────────
  test:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
      # The same installed dependencies as the api service, with the test and lint tools
      # added, running as root so it can write into the bind-mounted source and .eval/.
      target: test
    profiles: ["tools"]
    command: python -m pytest /app/tests -v
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-speaklab}:${DB_PASSWORD:-speaklab_dev}@postgres:5432/${DB_NAME:-speaklab}
      # Pointed at hosts that do not resolve, on purpose — NOT the real service names.
      # asr and tts share this network, so `http://asr:8101` would reach a running
      # service and the health tests would assert against it. Hosts that cannot exist
      # keep `make test` hermetic: the model layer it sees is absent.
      #
      # The suite that DOES want a real recogniser is tests/test_asr_golden.py, which
      # skips unless ASR_URL answers. `make asr-wer` runs it against the live container.
      ASR_URL: http://asr.invalid:8101
      TTS_URL: http://tts.invalid:8102
      PRON_URL: http://pron.invalid:8103
      # And the LLM, for the same reason. `extra_hosts` below makes host.docker.internal
      # resolve so that `make turn-latency` can reach the host's Ollama, which would let
      # the hermetic suite reach it too: a test would pass here because a model happened
      # to be running, and fail on CI where none is. `make test` sees no model at all.
      OLLAMA_BASE_URL: http://ollama.invalid:11434
      HEALTH_PROBE_TIMEOUT_S: "0.5"
    # Resolves host.docker.internal, so that a measurement run can be pointed at the
    # host's Ollama with `-e OLLAMA_BASE_URL=...` — which overrides the deliberately
    # unreachable default above. Nothing in the hermetic suite uses it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./api:/app
      # Read-only, and the flag is the point rather than caution. eval/ holds fixtures
      # graded BEFORE the run; a container that can rewrite them could turn a failing
      # eval into a passing one with nobody noticing. Mounted into the
      # test service and nowhere else.
      - ./eval:/app/eval:ro
      # Where a measurement writes its numbers, and the only writable thing the eval
      # path has. Deliberately NOT a subdirectory of eval/: the fixtures above are
      # read-only because the system being evaluated must not be able to rewrite the
      # corpus it is graded on, and a writable directory nested inside them would be a
      # hole in exactly that. Inputs in eval/, outputs in .eval/, different mounts.
      # Gitignored — a result belongs in docs/evaluation.md, which `make eval` writes
      # from these files on the host.
      - ./.eval:/app/.eval
      # The pron service's source, read-only, so that `api/tests/test_phone_map.py` and
      # `api/tests/test_g2p.py` can import the modules they are about. Those two tests
      # guard the phone map — a phone that maps to the wrong acoustic target produces
      # confident numbers that measure nothing — and a test that can only run inside a
      # 5 GB torch image is a test that stops being run. Neither module imports torch,
      # which is what makes this possible: `phone_map` needs only its vendored
      # vocab.json, and `g2p` takes its converter as an argument.
      #
      # Read-only for the same reason eval/ is: the tests assert *against* this source,
      # and a suite that could edit what it is asserting on is not a check.
      - ./infra/pron:/pron:ro
    networks:
      - speaklab

volumes:
  postgres_data:
  audio_data:       # user recordings — never in the working tree, never in git
  model_cache:      # whisper + piper + wav2vec2 weights, shared across the three services
  ollama_models:    # profile: llm only

networks:
  speaklab:
    driver: bridge
