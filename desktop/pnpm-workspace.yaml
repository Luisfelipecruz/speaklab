# pnpm's settings for the desktop package, the frontend's rules. It is one package, not a
# workspace; pnpm reads its settings from this file either way.

# A release is installed only once it has been public for a day. Set explicitly, which
# also makes it strict: a release younger than this fails the install instead of being
# quietly replaced by an older one.
minimumReleaseAge: 1440

# A release published with weaker evidence of where it came from than an earlier release
# of the same package is refused.
trustPolicy: no-downgrade

# Excepted by exact version, each one checked by hand: releases on an older major line
# that read as a downgrade only because newer lines carry provenance.
trustPolicyExclude:
  # The frontend's own exception, checked there.
  - semver@6.3.1
  # Through electron-builder (app-builder-lib and builder-util, by way of tiny-async-pool
  # 1.3.0, which asks for ^5.5.0). No advisory in OSV or GitHub's database (it is the 5.x
  # fix for CVE-2022-25883), not deprecated, the newest 5.x, its registry signature valid,
  # its integrity matching, and its files byte-identical to npm/node-semver at the v5.7.2
  # tag; published by an npm CLI maintainer the same day as 6.3.1.
  - semver@5.7.2

# No dependency runs an install script unless it is listed here as `true`. Electron has
# none: its binary is fetched by `install-electron`, which the build runs itself.
# electron-winstaller is electron-builder's Windows installer tool; a macOS build never
# runs it.
allowBuilds:
  electron-winstaller: false
