# CI runs the checks a reviewer would run by hand, and a scan for known vulnerabilities.
#
# It does NOT build the model service images. asr and pron pull hundreds of megabytes to
# gigabytes of weights, and a pipeline that downloads wav2vec2 on every push is a pipeline
# nobody waits for. What CI does check about pron is the part that can go wrong silently:
# `tests/test_phone_map.py` asserts the ARPAbet-to-eSpeak map against the model's real
# vocab.json, which is vendored at infra/pron/vocab.json so that it runs here — with no
# torch, no network and no 1.2 GB download. A wrong entry in that map produces confident
# numbers that measure nothing. tts is small enough to build here, but building one model
# image and not the others would make CI's coverage of the model layer look better than it
# is. The measurement suites skip unless a real service answers, which is why the URLs
# below name hosts that cannot.
#
# Every action is pinned to a commit, with its release in a comment. A tag can be moved to
# point at other code; a commit cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. No job here writes to the repository.
permissions:
  contents: read

jobs:
  api:
    name: API — lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: speaklab
          POSTGRES_USER: speaklab
          POSTGRES_PASSWORD: speaklab_dev
        ports:
          - 5432:5432
        # Without this the first test can beat Postgres to being ready, and the failure
        # looks like a database bug rather than a race.
        options: >-
          --health-cmd "pg_isready -U speaklab -d speaklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://speaklab:speaklab_dev@localhost:5432/speaklab
      # Hosts that CANNOT resolve, on purpose — `.invalid` is reserved by RFC 2606 for
      # exactly this. The health tests assert that unreachable model services produce a
      # degraded 200 rather than a 500, and the measurement suites skip when nothing
      # answers. Bare `asr`/`tts` would also fail to resolve on a runner, but a name that
      # resolves anywhere a real service might be running is a test that can quietly
      # start talking to it.
      ASR_URL: http://asr.invalid:8101
      TTS_URL: http://tts.invalid:8102
      PRON_URL: http://pron.invalid:8103
      HEALTH_PROBE_TIMEOUT_S: "0.5"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: |
            infra/api/requirements.txt
            infra/api/requirements-dev.txt

      - name: Install
        run: pip install -r infra/api/requirements.txt -r infra/api/requirements-dev.txt

      # Both trees. eval/ holds the harness — a runner, a report generator, and the
      # arithmetic the measurement suites share with them. Unlinted code that decides
      # whether a success criterion is met is not a place to save four seconds.
      - name: ruff
        run: ruff check api eval

      - name: black
        run: black --check api eval

      - name: pytest
        working-directory: api
        run: python -m pytest tests -v

      # The evaluation harness, end to end, with no model layer at all — which is the
      # only interesting way to run it here. Every measurement suite skips when its
      # service is absent, so what this proves is the property the whole harness rests
      # on: skipped suites produce a report that grades nothing as met, rather than an
      # empty file, a crash, or a table of green ticks. `--local` runs the suites in this
      # environment instead of a container; the report goes to a scratch path and
      # docs/evaluation.md is never touched by CI, because a report written where no
      # model exists would overwrite real measurements with zeroes.
      - name: Evaluation harness
        run: python eval/run.py --local --out "$RUNNER_TEMP/evaluation.md"

  frontend:
    name: Frontend — lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm at the version package.json's `packageManager` names.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --frozen-lockfile installs exactly the lockfile and fails if package.json and the
      # lockfile disagree, which is the difference between CI verifying the build and CI
      # producing a different one. The release-age, trust and install-script settings in
      # pnpm-workspace.yaml apply here as everywhere.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm run typecheck

      # Before the build, because a failing assertion is a faster and more specific
      # answer than a build that succeeds.
      - name: Jest
        run: pnpm test --ci

      - name: Build
        run: pnpm run build

  compose:
    name: Compose — the service graph parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pron stays behind its profile: it is about 2 GB, and the stack has to remain usable
      # by somebody who never downloads it. What this catches is the day somebody removes
      # that profile and makes `docker compose up` pull torch for everyone, or a typo in any
      # service, here rather than on a developer's machine.
      - name: Validate the default stack
        run: docker compose config --quiet

      - name: Validate every profile
        run: >-
          docker compose --profile pron --profile llm --profile tools config --quiet

  security:
    name: Security — known vulnerabilities, Dockerfiles and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trivy from its own image, pinned by digest: a digest names one image and nothing
      # else. It reads every requirements file and the frontend's lockfile, every
      # Dockerfile, and the tree for secrets, and fails on a HIGH or CRITICAL finding
      # that has a fixed release to move to. A finding with no fix yet is not counted,
      # because nothing in this repository could make it pass.
      - name: Trivy
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          fs --scanners vuln,misconfig,secret
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          /repo
