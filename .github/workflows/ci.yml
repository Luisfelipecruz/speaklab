# CI runs the same three checks a reviewer would run by hand, and nothing else.
#
# It deliberately does NOT build the model service images. asr and pron pull hundreds of
# megabytes to gigabytes of weights, and a pipeline that downloads wav2vec2 on every push
# is a pipeline nobody waits for. What CI *does* check about pron is the part that can go
# wrong silently: `tests/test_phone_map.py` asserts the ARPAbet-to-eSpeak map against the
# model's real vocab.json, which is vendored at infra/pron/vocab.json precisely so this
# runs here — with no torch, no network and no 1.2 GB download. That map is the file where
# a mistake produces confident numbers that measure nothing (handoff trap 1). tts is small enough that it could be built here — its
# voice is 63 MB — but building one model image and not the others would make CI's
# coverage of the model layer look better than it is. Both services' measurement suites
# skip unless a real service answers, which is why the URLs below name hosts that cannot.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: speaklab
          POSTGRES_USER: speaklab
          POSTGRES_PASSWORD: speaklab_dev
        ports:
          - 5432:5432
        # Without this the first test can beat Postgres to being ready, and the failure
        # looks like a database bug rather than a race.
        options: >-
          --health-cmd "pg_isready -U speaklab -d speaklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://speaklab:speaklab_dev@localhost:5432/speaklab
      # Hosts that CANNOT resolve, on purpose — `.invalid` is reserved by RFC 2606 for
      # exactly this. The health tests assert that unreachable model services produce a
      # degraded 200 rather than a 500, and the measurement suites skip when nothing
      # answers. Bare `asr`/`tts` would work here today, because a GitHub runner has no
      # such DNS entry — and that is precisely the assumption that broke in
      # docker-compose.yml when m4 put a real `asr` on the test network (trap 25).
      ASR_URL: http://asr.invalid:8101
      TTS_URL: http://tts.invalid:8102
      PRON_URL: http://pron.invalid:8103
      HEALTH_PROBE_TIMEOUT_S: "0.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/api/requirements.txt

      - name: Install
        run: pip install -r infra/api/requirements.txt

      - name: ruff
        run: ruff check api

      - name: black
        run: black --check api

      - name: pytest
        working-directory: api
        run: python -m pytest tests -v

  frontend:
    name: Frontend — lint, types, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if package.json and
      # the lockfile disagree, which is the difference between CI verifying the build
      # and CI producing a different one.
      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      # Jest and React Testing Library, arriving with m7 — the milestone that first put
      # behaviour in the browser worth testing. Before the build, because a failing
      # assertion is a faster and more specific answer than a build that succeeds.
      - name: Jest
        run: npm test -- --ci

      - name: Build
        run: npm run build

  compose:
    name: Compose — the service graph parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every build context this file names now exists — m8 created infra/pron, which was
      # declared here from m1 and kept inert by its profile. The profile stays: `pron` is
      # 1.78 GB and the stack has to remain usable by somebody who never downloads it, so
      # what this step now catches is the day somebody removes that profile and makes
      # `docker compose up` pull torch for everyone. The default stack builds five
      # services; a typo in any of them fails here rather than on a developer's machine.
      - name: Validate the default stack
        run: docker compose config --quiet

      - name: Validate every profile
        run: >-
          docker compose --profile pron --profile llm --profile tools config --quiet
