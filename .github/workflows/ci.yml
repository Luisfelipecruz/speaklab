# CI runs the same three checks a reviewer would run by hand, and nothing else.
#
# It deliberately does NOT build the model service images. asr, tts and pron pull
# hundreds of megabytes to gigabytes of weights, and a pipeline that downloads
# wav2vec2 on every push is a pipeline nobody waits for. Their own suites run against
# cached fixtures when those milestones land.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: speaklab
          POSTGRES_USER: speaklab
          POSTGRES_PASSWORD: speaklab_dev
        ports:
          - 5432:5432
        # Without this the first test can beat Postgres to being ready, and the failure
        # looks like a database bug rather than a race.
        options: >-
          --health-cmd "pg_isready -U speaklab -d speaklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://speaklab:speaklab_dev@localhost:5432/speaklab
      # Hosts that do not resolve, on purpose. The health tests assert that unreachable
      # model services produce a degraded 200 rather than a 500, and the cheapest way to
      # have an unreachable service is to name one.
      ASR_URL: http://asr:8101
      TTS_URL: http://tts:8102
      PRON_URL: http://pron:8103
      HEALTH_PROBE_TIMEOUT_S: "0.5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/api/requirements.txt

      - name: Install
        run: pip install -r infra/api/requirements.txt

      - name: ruff
        run: ruff check api

      - name: black
        run: black --check api

      - name: pytest
        working-directory: api
        run: python -m pytest tests -v

  frontend:
    name: Frontend — lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly the lockfile and fails if package.json and
      # the lockfile disagree, which is the difference between CI verifying the build
      # and CI producing a different one.
      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  compose:
    name: Compose — the service graph parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml declares build contexts that do not exist yet (infra/asr,
      # infra/tts, infra/pron, created by m4, m5 and m8). Profiles are what keeps them
      # inert. This step is what catches the day somebody removes a profile and breaks
      # `docker compose up` for everyone.
      - name: Validate the default stack
        run: docker compose config --quiet

      - name: Validate every profile
        run: >-
          docker compose --profile speech --profile pron --profile llm
          --profile tools config --quiet
