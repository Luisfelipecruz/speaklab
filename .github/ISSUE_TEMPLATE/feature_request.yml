name: Feature request
description: Something SpeakLab should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to practise or find out, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: How would we know it works?
      description: Which figure, counted by which command, would show it. Anything that puts a number in front of a learner needs one.
