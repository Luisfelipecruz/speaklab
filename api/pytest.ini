[pytest]
# `auto` rather than `strict`: every test in this suite is async, because every path
# through the app is. Marking each one individually would be noise.
asyncio_mode = auto

# Set explicitly because pytest-asyncio warns on every run when it is not. Function
# scope is what the default becomes in the next major, so this is the future default
# written down rather than a preference.
asyncio_default_fixture_loop_scope = function
