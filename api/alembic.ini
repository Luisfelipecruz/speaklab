# Alembic owns the schema. There is no init.sql and no `Base.metadata.create_all`
# anywhere in this repository, including in tests — a second way to build the schema is
# a second source of truth that diverges the first time a migration is added and only
# one of the two paths is updated (plan §3, D15).
#
# The database URL is NOT set here. env.py reads it from config.SYNC_DATABASE_URL, which
# is derived from DATABASE_URL, so migrations and the request path cannot end up
# pointing at different databases. ALEMBIC_DATABASE_URL overrides it, which is how the
# test suite migrates a scratch database.

[alembic]
script_location = alembic

# `.` is api/, the directory this file sits in, which is what makes `from config import
# ...` work inside env.py exactly as it does inside the running app.
prepend_sys_path = .

# YYYYMMDD_HHMM in front of the slug, so `ls versions/` is chronological. The revision
# id itself stays the short hand-written one (0001, 0002 ...) — it is what appears in
# `alembic history` and in the alembic_version table.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
